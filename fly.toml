# Optional host. fly launch --no-deploy --copy-config, set secrets (docs/deploy.md), fly deploy
# One machine at most: rate limits are counted in memory.
app = "kb-hub"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  KB_INBOX_BRANCH = "inbox"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
